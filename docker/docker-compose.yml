version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matrimonial_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/var/lib/mongodb

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: matrimonial-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mongodb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/matrimonial_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/Matrimonial_Details
      JWT_SECRET: your_jwt_secret_here

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: matrimonial-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data: